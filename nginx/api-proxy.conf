# Proxy to the Go backend, shared by /api/ and the rate-limited login paths.
proxy_pass http://mtg-portal-backend:8080;
proxy_set_header Host $host;
# The client address after real_ip (see default.conf.template); the backend
# throttles wrong passwords per client by it.
proxy_set_header X-Real-IP $remote_addr;
proxy_read_timeout 300s;
client_max_body_size 25m;
# Stream API responses straight through instead of buffering large JSON
# payloads to a temp file (avoids disk-dependent truncation).
proxy_buffering off;
