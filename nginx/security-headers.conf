# Security headers, included at server level and again in every location that
# sets headers of its own (an add_header there drops the inherited ones).
#
# CSP: scripts only from our own origin (Chart.js is bundled under js/vendor,
# the analytics tracker is proxied to /js/pl.js); inline styles stay allowed,
# the pages set style attributes. Card images and symbols come from Scryfall
# when the mirror is off or does not have a file yet (redirect, see below).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://cards.scryfall.io https://svgs.scryfall.io; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
# No Referer towards Scryfall or anybody else; own requests keep it.
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# Only has an effect over HTTPS (Traefik); browsers ignore it on plain HTTP.
add_header Strict-Transport-Security "max-age=31536000" always;
