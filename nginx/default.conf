server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # API requests are proxied to the Go backend container.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        client_max_body_size 25m;
        # Stream API responses straight through instead of buffering large JSON
        # payloads to a temp file (avoids disk-dependent truncation).
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
