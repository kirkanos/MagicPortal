server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # Collection/card JSON payloads run into several MB uncompressed for large
    # collections; gzip cuts that drastically for both the API and static assets.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # --- Reichweitenmessung (Plausible) ueber die eigene Domain ---
    # Skript und Ereignis-Endpunkt laufen first-party, weil Inhaltsblocker
    # Anfragen an fremde Hosts mit "plausible" im Pfad standardmaessig
    # wegfiltern (ERR_BLOCKED_BY_CLIENT). Die Namen hier sind bewusst neutral.
    #
    # Laengster Prefix gewinnt: /api/event landet bei Plausible, alles andere
    # unter /api/ weiterhin beim Backend.
    location = /js/pl.js {
        proxy_pass https://pls.kirkanos.net/js/script.js;
        proxy_set_header Host pls.kirkanos.net;
        proxy_ssl_server_name on;
        proxy_ssl_name pls.kirkanos.net;
        # Antwort darf zwischengespeichert werden, das Skript aendert sich selten.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /api/event {
        proxy_pass https://pls.kirkanos.net/api/event;
        proxy_set_header Host pls.kirkanos.net;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_name pls.kirkanos.net;
    }

    # API requests are proxied to the Go backend container.
    location /api/ {
        proxy_pass http://mtg-portal-backend:8080;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        client_max_body_size 25m;
        # Stream API responses straight through instead of buffering large JSON
        # payloads to a temp file (avoids disk-dependent truncation).
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ =404;
        # Always revalidate HTML/JS/CSS via ETag so updated assets are never
        # served stale from the browser cache (returns 304 when unchanged).
        add_header Cache-Control "no-cache" always;
    }
}
