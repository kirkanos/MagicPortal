<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MTG Sammlung – Karten</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="topnav">
  <span class="brand">🎴 MTG Sammlung</span>
  <a href="index.html" class="active">Karten</a>
  <a href="editions.html">Editionen</a>
  <a href="dashboard.html">Statistik</a>
  <a href="deck-checker.html">Deck-Checker</a>
</nav>

<main>
  <div class="stats-bar" id="stats-bar"></div>

  <div class="controls">
    <input type="text" id="search" placeholder="Kartenname suchen...">
    <select id="filter-set"><option value="">Alle Sets</option></select>
    <select id="filter-rarity"><option value="">Alle Raritäten</option></select>
    <select id="filter-color"><option value="">Alle Farben</option></select>
    <select id="filter-foil">
      <option value="">Normal &amp; Foil</option>
      <option value="normal">Normal</option>
      <option value="foil">Foil</option>
      <option value="etched">Etched</option>
    </select>
    <select id="sort-by">
      <option value="name">Sortieren: Name</option>
      <option value="set">Sortieren: Set</option>
      <option value="price-desc">Sortieren: Preis (hoch-niedrig)</option>
      <option value="price-asc">Sortieren: Preis (niedrig-hoch)</option>
      <option value="rarity">Sortieren: Rarität</option>
      <option value="added-desc">Sortieren: zuletzt hinzugefügt</option>
    </select>
  </div>

  <div class="result-count" id="result-count"></div>
  <div class="grid" id="card-grid"></div>
</main>

<div class="loading-overlay" id="loading-overlay">
  <div class="loading-text">Lade Sammlung...</div>
  <div class="loading-bar"><div class="loading-bar-fill"></div></div>
</div>

<div class="modal-overlay" id="card-modal">
  <div class="modal-body">
    <span class="modal-close">&times;</span>
  </div>
</div>

<script src="js/shared.js"></script>
<script src="js/grid.js"></script>
</body>
</html>
