<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-en="MagicPortal – Cards">MagicPortal – Karten</title>
<link rel="icon" type="image/svg+xml" href="images/magic-portal-icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="images/favicon-192.png">
<link rel="apple-touch-icon" href="images/favicon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="topnav">
  <a href="index.html" class="brand"><img src="images/magic-portal-logo.svg" alt="Magic Portal – A ManaBox Interface" class="brand-logo"></a>
  <a href="index.html" class="active" data-en="Cards">Karten</a>
  <a href="editions.html" data-en="Editions">Editionen</a>
  <a href="binders.html" data-en="Folders">Ordner</a>
  <a href="lists.html" data-en="Lists">Listen</a>
  <a href="decks.html" data-en="Decks">Decks</a>
  <a href="dashboard.html" data-en="Statistics">Statistik</a>
  <a href="deck-checker.html" data-en="Deck Checker">Deck-Checker</a>
  <span class="nav-actions">
    <button type="button" id="lang-toggle" class="lang-toggle" aria-label="Sprache" data-en-aria="Language"></button>
    <span class="sync-status" id="sync-status" title="Letzte Aktualisierung der Kartendaten/Preise" data-en-title="Last update of card data / prices"></span>
    <button type="button" id="csv-sync" class="reset-btn" title="Kartendaten & Preise jetzt von Scryfall aktualisieren" data-en-title="Refresh card data & prices from Scryfall now" data-en="🔄 Refresh" style="display:none">🔄 Aktualisieren</button>
    <button type="button" id="csv-unlock" class="reset-btn" title="Anmelden" data-en-title="Log in" data-en="🔑 Login" style="display:none">🔑 Login</button>
    <label class="upload-btn" id="csv-upload-label" title="Eigene ManaBox-CSV hochladen" data-en-title="Upload your own ManaBox CSV" style="display:none"><span data-en="⬆ Upload CSV">⬆ CSV hochladen</span>
      <input type="file" id="csv-upload" accept=".csv,text/csv" hidden>
    </label>
    <button type="button" id="csv-reset" class="reset-btn" title="Gesamte Sammlung leeren" data-en-title="Clear the entire collection" data-en="Clear" style="display:none">Leeren</button>
    <button type="button" id="csv-backup" class="reset-btn" title="Jetzt sichern (Sammlung + Wert-Historie)" data-en-title="Back up now (collection + value history)" data-en="💾 Backup" style="display:none">💾 Backup</button>
    <button type="button" id="csv-restore" class="reset-btn" title="Neuestes Backup wiederherstellen" data-en-title="Restore latest backup" data-en="⟲ Restore" style="display:none">⟲ Wiederherstellen</button>
  </span>
</nav>

<main>
  <div class="stats-bar" id="stats-bar"></div>

  <div class="controls">
    <input type="text" id="search" placeholder="Name, Text, Mana suchen..." data-en-placeholder="Search name, text, mana...">
    <select id="filter-set"><option value="" data-en="All sets">Alle Sets</option></select>
    <select id="filter-rarity"><option value="" data-en="All rarities">Alle Raritäten</option></select>
    <select id="filter-color"><option value="" data-en="All colors">Alle Farben</option></select>
    <select id="filter-foil">
      <option value="" data-en="Normal &amp; Foil">Normal &amp; Foil</option>
      <option value="normal">Normal</option>
      <option value="foil">Foil</option>
      <option value="etched">Etched</option>
    </select>
    <select id="filter-binder"><option value="" data-en="All folders &amp; lists">Alle Ordner &amp; Listen</option></select>
    <select id="filter-type"><option value="" data-en="All card types">Alle Kartentypen</option></select>
    <select id="filter-subtype"><option value="" data-en="All subtypes">Alle Untertypen</option></select>
    <select id="sort-by">
      <option value="name" data-en="Sort: Name">Sortieren: Name</option>
      <option value="set" data-en="Sort: Set">Sortieren: Set</option>
      <option value="value-desc" data-en="Sort: Single-card value (high → low)">Sortieren: Einzelkartenwert (hoch → niedrig)</option>
      <option value="value-asc" data-en="Sort: Single-card value (low → high)">Sortieren: Einzelkartenwert (niedrig → hoch)</option>
      <option value="price-desc" data-en="Sort: Purchase price (high → low)">Sortieren: Kaufpreis (hoch → niedrig)</option>
      <option value="price-asc" data-en="Sort: Purchase price (low → high)">Sortieren: Kaufpreis (niedrig → hoch)</option>
      <option value="rarity" data-en="Sort: Rarity">Sortieren: Rarität</option>
      <option value="released-desc" data-en="Sort: Release (newest first)">Sortieren: Erscheinung (neueste zuerst)</option>
      <option value="released-asc" data-en="Sort: Release (oldest first)">Sortieren: Erscheinung (älteste zuerst)</option>
      <option value="added-desc" data-en="Sort: Recently added">Sortieren: zuletzt hinzugefügt</option>
    </select>
  </div>

  <div class="result-count" id="result-count"></div>
  <div class="grid" id="card-grid"></div>
</main>

<footer class="site-footer">
  <span>&copy; 2026 <a href="https://www.kirkanos.net" target="_blank" rel="noopener">kirkanos</a></span>
  <a class="footer-gh" href="https://github.com/kirkanos/mtg-portal" target="_blank" rel="noopener" aria-label="GitHub Repository" title="Auf GitHub ansehen" data-en-title="View on GitHub">

  </a>
</footer>

<div class="loading-overlay" id="loading-overlay">
  <div class="loading-text" data-en="Loading collection...">Lade Sammlung...</div>
  <div class="loading-bar"><div class="loading-bar-fill"></div></div>
</div>

<div class="modal-overlay" id="card-modal">
  <div class="modal-body">
    <span class="modal-close">&times;</span>
  </div>
</div>

<script src="js/i18n.js"></script>
<script src="js/shared.js"></script>
<script src="js/grid.js"></script>
</body>
</html>
