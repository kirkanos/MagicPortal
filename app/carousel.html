<main>

    <input type="text" id="search" placeholder="Kartenname suchen...">
    <select id="filter-set"><option value="">Alle Sets</option></select>
  </div>

  <div class="carousel-wrap">
    <div class="carousel-card" id="carousel-card"></div>

      <span class="carousel-index" id="carousel-index"></span>
      <button id="next-card">(→) →</button>
    </div>
  </div>

<div class="loading-overlay" id="loading-overlay">
  <div class="loading-text">Lade Sammlung...</div>
  <div class="loading-bar"><div class="loading-bar-fill"></div></div>
