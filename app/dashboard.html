<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MTG Sammlung – Statistik</title>
<link rel="icon" type="image/svg+xml" href="images/magic-portal-icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="images/favicon-192.png">
<link rel="apple-touch-icon" href="images/favicon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="topnav">
  <a href="index.html" class="brand"><img src="images/magic-portal-logo.svg" alt="Magic Portal – A ManaBox Interface" class="brand-logo"></a>
  <a href="index.html">Karten</a>
  <a href="editions.html">Editionen</a>
  <a href="dashboard.html" class="active">Statistik</a>
  <a href="deck-checker.html">Deck-Checker</a>
  <span class="nav-actions">
    <span class="sync-status" id="sync-status" title="Letzte Aktualisierung der Kartendaten/Preise"></span>
    <button type="button" id="csv-sync" class="reset-btn" title="Kartendaten & Preise jetzt von Scryfall aktualisieren" style="display:none">🔄 Aktualisieren</button>
    <button type="button" id="csv-unlock" class="reset-btn" title="Upload mit Passwort freischalten" style="display:none">🔒 Upload freischalten</button>
    <label class="upload-btn" id="csv-upload-label" title="Eigene ManaBox-CSV hochladen" style="display:none">⬆ CSV hochladen
      <input type="file" id="csv-upload" accept=".csv,text/csv" hidden>
    </label>
    <button type="button" id="csv-reset" class="reset-btn" title="Gesamte Sammlung leeren" style="display:none">Leeren</button>
  </span>
</nav>

<main>
  <div class="stats-bar" id="stats-bar"></div>
  <div class="chart-grid">
    <div class="chart-card"><h3>Rarität</h3><canvas id="chart-rarity"></canvas></div>
    <div class="chart-card"><h3>Farben</h3><canvas id="chart-color"></canvas></div>
    <div class="chart-card"><h3>Top 10 Sets nach Kartenanzahl</h3><canvas id="chart-sets"></canvas></div>
    <div class="chart-card"><h3>Top 10 Editionen nach Marktwert</h3><canvas id="chart-set-value"></canvas></div>
    <div class="chart-card"><h3>Normal vs. Foil vs. Etched</h3><canvas id="chart-foil"></canvas></div>
    <div class="chart-card"><h3>Kaufwert pro Monat (kumulativ)</h3><canvas id="chart-value-time"></canvas></div>
    <div class="chart-card"><h3>Top 10 wertvollste Karten (Kaufpreis)</h3><canvas id="chart-top-value"></canvas></div>
  </div>
</main>

<div class="loading-overlay" id="loading-overlay">
  <div class="loading-text">Lade Sammlung...</div>
  <div class="loading-bar"><div class="loading-bar-fill"></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
<script src="js/shared.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
