# Prometheus-Alertregeln (funktionieren unverändert auch als Grafana-Alerts,
# wenn dort "Prometheus-Regeln importieren" genutzt wird).
groups:
  - name: mtg-portal
    rules:
      # Der Fall, der schon zweimal auftrat: eine zweite Instanz mit derselben
      # Konfiguration zieht die CSV aus der Nextcloud und löscht sie dort. Diese
      # Instanz löscht die Quelldatei ausschließlich nach erfolgreichem Import,
      # ein Missverhältnis kann es also nur von außen geben.
      - alert: MtgImportQuelleVerschwundenOhneImport
        expr: |
          increase(mtg_import_source_deleted_total[6h])
            > increase(mtg_imports_total{result="success"}[6h])
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Mehr gelöschte Quelldateien als erfolgreiche Importe"
          description: "Deutet auf eine zweite Instanz mit derselben WEBDAV_URL hin."

      - alert: MtgImportFehlgeschlagen
        expr: mtg_remote_import_last_failed == 1
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "Letzter Remote-Import ist fehlgeschlagen"

      - alert: MtgKeinBackup
        expr: time() - mtg_last_backup_timestamp_seconds > 60 * 60 * 30
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "Seit über 30 Stunden kein Backup mehr"

      - alert: MtgKartendatenVeraltet
        expr: time() - mtg_last_card_sync_timestamp_seconds > 60 * 60 * 24
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "Scryfall-Sync liefert seit über 24 Stunden keine neuen Daten"

      # Nach einem Import ohne passende Katalogdaten bleiben Karten ohne Preis
      # und Bild – sichtbares Symptom eines halb gelungenen Imports.
      - alert: MtgKartenOhnePreis
        expr: mtg_collection_cards_without_price > 0
        for: 2h
        labels: {severity: info}
        annotations:
          summary: "{{ $value }} Karten ohne Scryfall-Treffer"

      - alert: MtgBackendNichtErreichbar
        expr: up{job="mtg-portal"} == 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "Backend antwortet nicht auf Scrapes"
