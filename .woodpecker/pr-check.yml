# PR check: validates pull requests (above all Renovate's) without deploying
# anything. The deploy in woodpecker.yml still only runs on a push to main.
#
#   1. decrypt .env from .env.enc so compose knows every variable
#   2. docker compose config: syntax, variables, included files
#   3. every image tag from the compose file and the Dockerfile must exist in
#      its registry - a Renovate PR with a wrong tag fails here, not at deploy
#      time
#   4. the backend's tests (go vet, go test), with the Go image the backend
#      Dockerfile builds with
labels:
  backend: docker

when:
  - event: pull_request

steps:
  - name: env
    image: registry.kirkanos.net/images/ci-build:alpine
    pull: true
    environment:
      SOPS_AGE_KEY:
        from_secret: sops_age_key
    commands:
      - for f in .env.enc docker-compose.env.enc; do if [ -f "$f" ]; then sops --decrypt --input-type dotenv --output-type dotenv --output "$(echo $f | sed 's/\.enc$//')" "$f"; fi; done
      - ls -la .env* 2>/dev/null || true

  - name: compose config
    image: docker:cli
    commands:
      - docker compose config --quiet
      - docker compose config --format json > .compose.json
      - echo "compose config ok"

  - name: collect images
    image: registry.kirkanos.net/images/ci-build:alpine
    commands:
      # Only services with a prebuilt image; built images are in no registry.
      - jq -r '.services[] | select(.build == null) | .image' .compose.json > .images.txt
      # Base images from the Dockerfile, without stage names (no ":" or "/") and without variables.
      - if [ -f Dockerfile ]; then sed -nE 's/^FROM +(--[^ ]+ +)?([^ ]+).*/\2/Ip' Dockerfile | grep -E '[:/]' | grep -v '\$' >> .images.txt; fi
      # Renovate pins some images as tag@sha256:...; skopeo will not take both,
      # so the digest is checked - which is what the deploy pulls anyway.
      - sed -i -E 's/:[^@/]+@sha256:/@sha256:/' .images.txt
      - sort -u .images.txt -o .images.txt
      - cat .images.txt

  - name: image tags
    image: quay.io/skopeo/stable:latest
    commands:
      - for img in $(cat .images.txt); do case "$img" in registry.kirkanos.net/*) echo "skip (private) $img";; *) echo "check $img"; skopeo inspect --raw "docker://$img" > /dev/null || exit 1;; esac; done
      - echo "all image tags exist"

  - name: go test
    image: golang:1.27-alpine
    commands:
      - cd backend
      - go vet ./...
      - go test ./...
