clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      depth: 50
      lfs: false

when:
  - event: push
    branch: main

steps:
  - name: Decrypt .env File
    image: registry.kirkanos.net/images/ci-build:alpine
    pull: true
    environment:
      SOPS_AGE_KEY:
        from_secret: sops_age_key
    commands:
      - "sops --decrypt --input-type dotenv --output-type dotenv --output .env .env.enc"
    when:
      - event: push

  - name: deploy files
    image: registry.kirkanos.net/images/ci-build:alpine
    volumes: [ "/services/common/.ssh:/root/.ssh" ]
    environment:
      SSH_HOST_LOCAL:
        from_secret: ssh_host_local
    commands:
      - set -a && . ./.env && set +a
      - test -n "$SERVICE" || (echo "SERVICE ist leer" && exit 1)
      - test -n "$SSH_HOST_LOCAL" || (echo "SSH_HOST_LOCAL ist leer" && exit 1)
      - echo "Deploy target host=$SSH_HOST_LOCAL service=$SERVICE"
      - export SSH_OPTS='-o BatchMode=yes -o RequestTTY=no -o ConnectTimeout=30 -o ConnectionAttempts=1 -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -p822'
      - export SCP_OPTS='-o BatchMode=yes -o ConnectTimeout=30 -o ConnectionAttempts=1 -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -P822'
      - timeout 60 sh -c "ssh -n -T $SSH_OPTS \"$SSH_HOST_LOCAL\" \"mkdir -p /services/$SERVICE/nginx /services/$SERVICE/app /services/$SERVICE/backend\""
      - echo "Upload root files"
      - timeout 120 sh -c "scp $SCP_OPTS docker-compose.yml Dockerfile .dockerignore .env \"$SSH_HOST_LOCAL\":/services/$SERVICE/"
      - echo "Upload nginx/"
      - timeout 120 sh -c "scp $SCP_OPTS -r nginx/* \"$SSH_HOST_LOCAL\":/services/$SERVICE/nginx/"
      - echo "Upload app/"
      - timeout 240 sh -c "scp $SCP_OPTS -r app/* \"$SSH_HOST_LOCAL\":/services/$SERVICE/app/"
      - echo "Upload backend/"
      - timeout 120 sh -c "scp $SCP_OPTS -r backend/* \"$SSH_HOST_LOCAL\":/services/$SERVICE/backend/"
      - echo "Upload systemd unit"
      - sed -e "s/%SERVICE%/$SERVICE/g" template.service > "$SERVICE.service"
      - timeout 60 sh -c "scp $SCP_OPTS \"$SERVICE.service\" \"$SSH_HOST_LOCAL\":/etc/systemd/system"
      - timeout 60 sh -c "ssh -n -T $SSH_OPTS \"$SSH_HOST_LOCAL\" \"systemctl daemon-reload && systemctl enable $SERVICE\""
    when:
      - event: push

  - name: restart service
    image: registry.kirkanos.net/images/ci-build:alpine
    volumes: [ "/services/common/.ssh:/root/.ssh" ]
    environment:
      SSH_HOST_LOCAL:
        from_secret: ssh_host_local
    commands:
      - set -a && . ./.env && set +a
      - test -n "$SERVICE" || (echo "SERVICE ist leer" && exit 1)
      - test -n "$SSH_HOST_LOCAL" || (echo "SSH_HOST_LOCAL ist leer" && exit 1)
      - export SSH_OPTS='-o BatchMode=yes -o RequestTTY=no -o ConnectTimeout=30 -o ConnectionAttempts=1 -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -p822'
      - timeout 60 sh -c "ssh -n -T $SSH_OPTS \"$SSH_HOST_LOCAL\" \"systemctl stop $SERVICE\" || true"
      - timeout 120 sh -c "ssh -n -T $SSH_OPTS \"$SSH_HOST_LOCAL\" \"systemctl start $SERVICE\""
      - echo "Service restart done (Build laeuft im Hintergrund via systemd)"
    when:
      - event: push
