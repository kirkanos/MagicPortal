# Local test environment - deliberately separate from docker-compose.yml (server).
#
#   docker compose -f docker-compose.local.yml up --build
#   -> http://localhost:8088
#
# Intentionally standalone rather than an override file: a
# docker-compose.override.yml would be loaded automatically on the server.
# This file has to be passed explicitly with -f and is therefore inert there.
#
# A safety net against "the production config accidentally runs locally": the
# container environment comes exclusively from .env.local (env_file), never
# from .env. Everything that could modify something in Nextcloud/Drive is
# hard-wired below - environment beats env_file, so even a wrong .env.local
# cannot switch it on by accident.

# Own project name -> own volumes/networks, no collision with the server stack.
name: mtg-portal-local

services:
  backend:
    build: ./backend
    container_name: mtg-portal-local-backend
    env_file:
      - .env.local
    environment:
      - DB_PATH=/data/mtg.db
      - IMAGE_DIR=/images
      # --- not overridable: no write access to remote storage ---
      # NEVER delete the source file after an import (otherwise the local
      # instance steals the server's CSV from Nextcloud).
      - REMOTE_IMPORT_DELETE=false
      # No backup uploads: the local state would otherwise overwrite the
      # server's backup of the day (same filename) or delete it when pruning.
      - WEBDAV_BACKUP_DIR=
      - GDRIVE_BACKUP_FOLDER_ID=
    # Publish the metrics port locally so a local Prometheus - or a plain
    # curl http://localhost:9091/metrics - can reach it.
    ports:
      - "127.0.0.1:9091:9090"
    # Same alias as in the server stack, so the nginx configuration baked into
    # the image works unchanged.
    networks:
      default:
        aliases:
          - mtg-portal-backend
    volumes:
      - local-db:/data
      - local-images:/images
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    pids_limit: 256
    restart: unless-stopped

  web:
    build:
      context: .
    container_name: mtg-portal-local-web
    depends_on:
      - backend
    # Published on localhost only, no Traefik.
    ports:
      - "127.0.0.1:8088:80"
    env_file:
      - .env.local
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
      # The nginx image writes the configuration from the template here, and
      # the entrypoint script writes the analytics snippets.
      - /etc/nginx/conf.d
    volumes:
      - local-images:/usr/share/nginx/html/img:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    mem_limit: 128m
    pids_limit: 128
    restart: unless-stopped

volumes:
  local-db:
  local-images:
