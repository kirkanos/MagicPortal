# MagicPortal without the trimmings - the minimum to run it yourself.
#
#   docker compose -f docker-compose.standalone.yml up -d --build
#   -> http://localhost:8080
#
# Difference to docker-compose.yml: there both containers sit in an external
# traefik-network and are routed outwards with TLS via Traefik labels; here a
# port is simply published. No Traefik, no external network, no metrics
# exposed, no analytics.
#
# It runs with no configuration at all. Everything optional comes from the
# environment or a .env next to this file - see .env.sample and the README.
#
# Afterwards you upload the collection as a ManaBox CSV through the interface;
# the backend fetches the catalog from Scryfall by itself.

name: mtg-portal

services:
  backend:
    build: ./backend
    environment:
      # Empty = anyone may upload, reset and sync. That is acceptable as long
      # as the port binds to 127.0.0.1 only (see below); put something here as
      # soon as the portal is reachable on the network.
      - UPLOAD_PASSWORD=${UPLOAD_PASSWORD:-}
      - DB_PATH=/data/mtg.db
      # Sync against the Scryfall catalog (minutes between two runs).
      - SYNC_INTERVAL_MINUTES=${SYNC_INTERVAL_MINUTES:-}
      # Automatic import from Nextcloud/Google Drive: off until configured.
      - REMOTE_IMPORT_INTERVAL_MINUTES=${REMOTE_IMPORT_INTERVAL_MINUTES:-}
      - REMOTE_IMPORT_DELETE=${REMOTE_IMPORT_DELETE:-false}
      - WEBDAV_URL=${WEBDAV_URL:-}
      - WEBDAV_USER=${WEBDAV_USER:-}
      - WEBDAV_PASSWORD=${WEBDAV_PASSWORD:-}
      - GDRIVE_FILE_ID=${GDRIVE_FILE_ID:-}
      - GDRIVE_SA_JSON=${GDRIVE_SA_JSON:-}
      # Automatic backup of your own data: off until a target is set.
      - BACKUP_INTERVAL_HOURS=${BACKUP_INTERVAL_HOURS:-}
      - BACKUP_KEEP=${BACKUP_KEEP:-30}
      - WEBDAV_BACKUP_DIR=${WEBDAV_BACKUP_DIR:-}
      - GDRIVE_BACKUP_FOLDER_ID=${GDRIVE_BACKUP_FOLDER_ID:-}
      # Local mirror of the card images (~1.6 GB at 14,000 printings).
      - IMAGE_MIRROR=${IMAGE_MIRROR:-false}
      - IMAGE_DIR=/images
      - IMAGE_SYNC_HOUR=${IMAGE_SYNC_HOUR:-3}
      - IMAGE_SIZES=${IMAGE_SIZES:-small,normal}
      - IMAGE_RATE_PER_SECOND=${IMAGE_RATE_PER_SECOND:-10}
      - IMAGE_MAX_BYTES=${IMAGE_MAX_BYTES:-3221225472}
      # Image hash index for the Android scanner (default: off). Hashes the
      # small scans of old-frame and owned printings at night, ~350 MB fetched
      # once; HASH_SCOPE=collection|old|all.
      - HASH_INDEX=${HASH_INDEX:-false}
      - HASH_SCOPE=${HASH_SCOPE:-old}
      - HASH_SYNC_HOUR=${HASH_SYNC_HOUR:-4}
      - HASH_RATE_PER_SECOND=${HASH_RATE_PER_SECOND:-8}
      # Prometheus endpoint. It runs but is not published;
      # METRICS_PORT=off disables it entirely.
      - METRICS_PORT=${METRICS_PORT:-9090}
      - METRICS_CACHE_SECONDS=${METRICS_CACHE_SECONDS:-30}
    volumes:
      - mtg-db:/data
      - mtg-images:/images
    # nginx proxies /api/ to this name - that is what the configuration says.
    networks:
      default:
        aliases:
          - mtg-portal-backend
    # --- Hardening (identical to the server stack) ---
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    pids_limit: 256
    restart: unless-stopped

  web:
    build:
      context: .
    depends_on:
      - backend
    # Reachable from the same machine only by default. For access from your
    # home network set BIND=0.0.0.0 - but then please set UPLOAD_PASSWORD too.
    # A name of its own instead of PORT, because PORT in docker-compose.yml
    # means the internal port Traefik routes to - a shared .env should not
    # mean both things at once.
    ports:
      - "${BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    environment:
      # Analytics - without these values not a line of third-party code loads.
      - ANALYTICS_SCRIPT_URL=${ANALYTICS_SCRIPT_URL:-}
      - ANALYTICS_EVENT_URL=${ANALYTICS_EVENT_URL:-}
      - ANALYTICS_WEBSITE_ID=${ANALYTICS_WEBSITE_ID:-}
      - ANALYTICS_ID_ATTRIBUTE=${ANALYTICS_ID_ATTRIBUTE:-data-website-id}
      - ANALYTICS_EVENT_PATH=${ANALYTICS_EVENT_PATH:-/js/api/send}
    volumes:
      # Read-only: nginx serves mirrored images directly.
      - mtg-images:/usr/share/nginx/html/img:ro
    # --- Hardening (identical to the server stack) ---
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
      # The nginx image writes the configuration from the template here, and
      # the entrypoint script writes the analytics snippets.
      - /etc/nginx/conf.d
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    mem_limit: 128m
    pids_limit: 128
    restart: unless-stopped

volumes:
  mtg-db:
  mtg-images:
