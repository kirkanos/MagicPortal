networks:
  traefik-network:
    external: true

services:
  backend:
    build: ./backend
    container_name: ${SERVICE}-backend
    environment:
      # Passwort fuer Upload/Reset/Sync (aus .env; leer = kein Passwortschutz).
      - UPLOAD_PASSWORD=${UPLOAD_PASSWORD:-}
      - DB_PATH=/data/mtg.db
      # Automatischer Remote-Import (alle Felder optional; leer = deaktiviert).
      - REMOTE_IMPORT_INTERVAL_MINUTES=${REMOTE_IMPORT_INTERVAL_MINUTES:-15}
      # -- Nextcloud / WebDAV --
      - WEBDAV_URL=${WEBDAV_URL:-}
      - WEBDAV_USER=${WEBDAV_USER:-}
      - WEBDAV_PASSWORD=${WEBDAV_PASSWORD:-}
      # -- Google Drive (Service-Account) --
      - GDRIVE_FILE_ID=${GDRIVE_FILE_ID:-}
      # Service-Account-JSON: inline, base64-kodiert oder Pfad zu gemounteter Datei.
      - GDRIVE_SA_JSON=${GDRIVE_SA_JSON:-}
      # Automatisches Backup der eigenen Daten (Historie + Sammlung).
      - BACKUP_INTERVAL_HOURS=${BACKUP_INTERVAL_HOURS:-24}
      - BACKUP_KEEP=${BACKUP_KEEP:-30}
      # -- Nextcloud / WebDAV (Ziel-Ordner, gleiche Zugangsdaten wie oben) --
      - WEBDAV_BACKUP_DIR=${WEBDAV_BACKUP_DIR:-}
      # -- Google Drive (Ziel-Ordner-ID, gleiches Service-Account wie oben) --
      - GDRIVE_BACKUP_FOLDER_ID=${GDRIVE_BACKUP_FOLDER_ID:-}
    volumes:
      - mtg-db:/data
    # --- Hardening ---
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    pids_limit: 256
    restart: unless-stopped

  web:
    build:
      context: .
    container_name: ${SERVICE}
    depends_on:
      - backend
    # --- Hardening ---
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    mem_limit: 128m
    pids_limit: 128
    restart: unless-stopped
    networks:
      - default
      - traefik-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${SERVICE}.entrypoints=http"
      - "traefik.http.routers.${SERVICE}.rule=Host(`${HOST}`)"
      - "traefik.http.middlewares.${SERVICE}-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.${SERVICE}.middlewares=${SERVICE}-https-redirect"
      - "traefik.http.routers.${SERVICE}-secure.entrypoints=https"
      - "traefik.http.routers.${SERVICE}-secure.rule=Host(`${HOST}`)"
      - "traefik.http.routers.${SERVICE}-secure.tls=true"
      - "traefik.http.routers.${SERVICE}-secure.tls.certresolver=default"
      - "traefik.http.routers.${SERVICE}-secure.service=${SERVICE}"
      - "traefik.http.services.${SERVICE}.loadbalancer.server.port=${PORT}"
      - "traefik.docker.network=traefik-network"

volumes:
  mtg-db:
