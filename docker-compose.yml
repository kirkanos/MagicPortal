networks:
  traefik-network:
    external: true

services:
  backend:
    build: ./backend
    container_name: ${SERVICE}-backend
    environment:
      # Password for upload/reset/sync (from .env; empty = no protection).
      - UPLOAD_PASSWORD=${UPLOAD_PASSWORD:-}
      - DB_PATH=/data/mtg.db
      # Automatic remote import (all fields optional; empty = disabled).
      - REMOTE_IMPORT_INTERVAL_MINUTES=${REMOTE_IMPORT_INTERVAL_MINUTES:-15}
      # Delete the source file after a successful import (default: true).
      - REMOTE_IMPORT_DELETE=${REMOTE_IMPORT_DELETE:-true}
      # -- Nextcloud / WebDAV --
      - WEBDAV_URL=${WEBDAV_URL:-}
      - WEBDAV_USER=${WEBDAV_USER:-}
      - WEBDAV_PASSWORD=${WEBDAV_PASSWORD:-}
      # -- Google Drive (service account) --
      - GDRIVE_FILE_ID=${GDRIVE_FILE_ID:-}
      # Service account JSON: inline, base64-encoded or a path to a mounted file.
      - GDRIVE_SA_JSON=${GDRIVE_SA_JSON:-}
      # Automatic backup of your own data (history + collection).
      - BACKUP_INTERVAL_HOURS=${BACKUP_INTERVAL_HOURS:-24}
      - BACKUP_KEEP=${BACKUP_KEEP:-30}
      # -- Nextcloud / WebDAV (target folder, same credentials as above) --
      - WEBDAV_BACKUP_DIR=${WEBDAV_BACKUP_DIR:-}
      # -- Google Drive (target folder ID, same service account as above) --
      - GDRIVE_BACKUP_FOLDER_ID=${GDRIVE_BACKUP_FOLDER_ID:-}
      # Local mirror of the card images and symbols (default: off).
      # Needs the mtg-images volume; the run happens at night.
      - IMAGE_MIRROR=${IMAGE_MIRROR:-false}
      - IMAGE_DIR=/images
      - IMAGE_SYNC_HOUR=${IMAGE_SYNC_HOUR:-3}
      - IMAGE_SIZES=${IMAGE_SIZES:-small,normal}
      - IMAGE_RATE_PER_SECOND=${IMAGE_RATE_PER_SECOND:-10}
      - IMAGE_MAX_BYTES=${IMAGE_MAX_BYTES:-3221225472}
      # Image hash index for the Android scanner (default: off). Hashes the
      # small scans of old-frame and owned printings at night, ~350 MB fetched
      # once; HASH_SCOPE=collection|old|all.
      - HASH_INDEX=${HASH_INDEX:-false}
      - HASH_SCOPE=${HASH_SCOPE:-old}
      - HASH_SYNC_HOUR=${HASH_SYNC_HOUR:-4}
      - HASH_RATE_PER_SECOND=${HASH_RATE_PER_SECOND:-8}
      # Prometheus endpoint on a separate port (METRICS_PORT=off disables it).
      # Deliberately NOT behind nginx/Traefik: the metrics reveal collection
      # value and error states. Prometheus reaches them via the traefik-network.
      - METRICS_PORT=${METRICS_PORT:-9090}
      # How long the database figures are cached between scrapes.
      - METRICS_CACHE_SECONDS=${METRICS_CACHE_SECONDS:-30}
    volumes:
      - mtg-db:/data
      # The only writable path besides /data; the mirror grows to ~1.6 GB and
      # therefore gets a volume of its own, otherwise it would end up in every
      # backup.
      - mtg-images:/images
    # --- Hardening ---
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    pids_limit: 256
    restart: unless-stopped
    # Both containers sit exclusively in the shared traefik-network: that is
    # how Prometheus from the monitoring stack reaches the metrics port
    # (scrape target: ${SERVICE}-backend:9090). The backend carries no Traefik
    # labels, so it is not routed to the outside.
    #
    # The alias is deliberately unique: in a shared network every stack
    # registers aliases for its service names, and a second stack with a
    # service called "backend" would claim the name twice - nginx would then
    # randomly end up at the wrong container. Hence nginx proxies to this name.
    networks:
      traefik-network:
        aliases:
          - mtg-portal-backend

  web:
    build:
      context: .
    container_name: ${SERVICE}
    depends_on:
      - backend
    environment:
      # Analytics. Without a script and event URL nothing happens at all:
      # no proxy, no script in the pages. See the README.
      - ANALYTICS_SCRIPT_URL=${ANALYTICS_SCRIPT_URL:-}
      - ANALYTICS_EVENT_URL=${ANALYTICS_EVENT_URL:-}
      - ANALYTICS_WEBSITE_ID=${ANALYTICS_WEBSITE_ID:-}
      - ANALYTICS_ID_ATTRIBUTE=${ANALYTICS_ID_ATTRIBUTE:-data-website-id}
      - ANALYTICS_EVENT_PATH=${ANALYTICS_EVENT_PATH:-/js/api/send}
    # --- Hardening ---
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
      # The nginx image writes the configuration generated from the template here.
      - /etc/nginx/conf.d
    volumes:
      # Read-only: nginx serves mirrored images directly.
      - mtg-images:/usr/share/nginx/html/img:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    mem_limit: 128m
    pids_limit: 128
    restart: unless-stopped
    networks:
      - traefik-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${SERVICE}.entrypoints=http"
      - "traefik.http.routers.${SERVICE}.rule=Host(`${HOST}`)"
      - "traefik.http.middlewares.${SERVICE}-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.${SERVICE}.middlewares=${SERVICE}-https-redirect"
      - "traefik.http.routers.${SERVICE}-secure.entrypoints=https"
      - "traefik.http.routers.${SERVICE}-secure.rule=Host(`${HOST}`)"
      - "traefik.http.routers.${SERVICE}-secure.tls=true"
      - "traefik.http.routers.${SERVICE}-secure.tls.certresolver=default"
      - "traefik.http.routers.${SERVICE}-secure.service=${SERVICE}"
      - "traefik.http.services.${SERVICE}.loadbalancer.server.port=${PORT}"
      - "traefik.docker.network=traefik-network"

volumes:
  mtg-db:
  mtg-images:
