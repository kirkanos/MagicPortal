networks:
  traefik-network:
    external: true

services:
  backend:
    build: ./backend
    container_name: ${SERVICE}-backend
    environment:
      # Passwort fuer Upload/Reset/Sync (aus .env; leer = kein Passwortschutz).
      - UPLOAD_PASSWORD=${UPLOAD_PASSWORD:-}
      - DB_PATH=/data/mtg.db
      # Automatischer Remote-Import (alle Felder optional; leer = deaktiviert).
      - REMOTE_IMPORT_INTERVAL_MINUTES=${REMOTE_IMPORT_INTERVAL_MINUTES:-15}
      # Quelldatei nach erfolgreichem Import löschen (Standard: true).
      - REMOTE_IMPORT_DELETE=${REMOTE_IMPORT_DELETE:-true}
      # -- Nextcloud / WebDAV --
      - WEBDAV_URL=${WEBDAV_URL:-}
      - WEBDAV_USER=${WEBDAV_USER:-}
      - WEBDAV_PASSWORD=${WEBDAV_PASSWORD:-}
      # -- Google Drive (Service-Account) --
      - GDRIVE_FILE_ID=${GDRIVE_FILE_ID:-}
      # Service-Account-JSON: inline, base64-kodiert oder Pfad zu gemounteter Datei.
      - GDRIVE_SA_JSON=${GDRIVE_SA_JSON:-}
      # Automatisches Backup der eigenen Daten (Historie + Sammlung).
      - BACKUP_INTERVAL_HOURS=${BACKUP_INTERVAL_HOURS:-24}
      - BACKUP_KEEP=${BACKUP_KEEP:-30}
      # -- Nextcloud / WebDAV (Ziel-Ordner, gleiche Zugangsdaten wie oben) --
      - WEBDAV_BACKUP_DIR=${WEBDAV_BACKUP_DIR:-}
      # -- Google Drive (Ziel-Ordner-ID, gleiches Service-Account wie oben) --
      - GDRIVE_BACKUP_FOLDER_ID=${GDRIVE_BACKUP_FOLDER_ID:-}
      # Lokaler Spiegel der Kartenbilder und Symbole (Standard: aus).
      # Braucht das Volume mtg-images; der Lauf passiert nachts.
      - IMAGE_MIRROR=${IMAGE_MIRROR:-false}
      - IMAGE_DIR=/images
      - IMAGE_SYNC_HOUR=${IMAGE_SYNC_HOUR:-3}
      - IMAGE_SIZES=${IMAGE_SIZES:-small,normal}
      - IMAGE_RATE_PER_SECOND=${IMAGE_RATE_PER_SECOND:-10}
      - IMAGE_MAX_BYTES=${IMAGE_MAX_BYTES:-3221225472}
      # Prometheus-Endpunkt auf eigenem Port (METRICS_PORT=off schaltet ihn ab).
      # Bewusst NICHT hinter nginx/Traefik: die Metriken zeigen Sammlungswert und
      # Fehlerzustaende. Prometheus erreicht sie ueber das traefik-network.
      - METRICS_PORT=${METRICS_PORT:-9090}
      # Wie lange DB-Kennzahlen zwischen Scrapes zwischengespeichert werden.
      - METRICS_CACHE_SECONDS=${METRICS_CACHE_SECONDS:-30}
    volumes:
      - mtg-db:/data
      # Einziger beschreibbarer Pfad neben /data; der Spiegel waechst auf
      # ~1,6 GB und hat deshalb ein eigenes Volume, sonst landet er in jedem
      # Backup.
      - mtg-images:/images
    # --- Hardening ---
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    pids_limit: 256
    restart: unless-stopped
    # Beide Container haengen ausschliesslich im gemeinsamen traefik-network:
    # so erreicht Prometheus aus dem Monitoring-Stack den Metrics-Port
    # (Scrape-Ziel: ${SERVICE}-backend:9090). Traefik-Labels hat das Backend
    # keine, es wird also nicht nach aussen geroutet.
    #
    # Der Alias ist bewusst eindeutig: in einem geteilten Netz vergibt jeder
    # Stack die Aliase seiner Servicenamen, und ein zweiter Stack mit einem
    # Service "backend" wuerde den Namen doppelt belegen - nginx landete dann
    # zufaellig beim falschen Container. Darum proxyt nginx auf diesen Namen.
    networks:
      traefik-network:
        aliases:
          - mtg-portal-backend

  web:
    build:
      context: .
    container_name: ${SERVICE}
    depends_on:
      - backend
    environment:
      # Umami-Website-ID, nginx setzt sie in die HTML-Seiten ein. Leer = kein Tracking.
      - UMAMI_WEBSITE_ID=${UMAMI_WEBSITE_ID:-}
    # --- Hardening ---
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
      # Hierhin schreibt das nginx-Image die aus dem Template erzeugte Konfiguration.
      - /etc/nginx/conf.d
    volumes:
      # Nur lesend: nginx liefert gespiegelte Bilder direkt aus.
      - mtg-images:/usr/share/nginx/html/img:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    mem_limit: 128m
    pids_limit: 128
    restart: unless-stopped
    networks:
      - traefik-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${SERVICE}.entrypoints=http"
      - "traefik.http.routers.${SERVICE}.rule=Host(`${HOST}`)"
      - "traefik.http.middlewares.${SERVICE}-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.${SERVICE}.middlewares=${SERVICE}-https-redirect"
      - "traefik.http.routers.${SERVICE}-secure.entrypoints=https"
      - "traefik.http.routers.${SERVICE}-secure.rule=Host(`${HOST}`)"
      - "traefik.http.routers.${SERVICE}-secure.tls=true"
      - "traefik.http.routers.${SERVICE}-secure.tls.certresolver=default"
      - "traefik.http.routers.${SERVICE}-secure.service=${SERVICE}"
      - "traefik.http.services.${SERVICE}.loadbalancer.server.port=${PORT}"
      - "traefik.docker.network=traefik-network"

volumes:
  mtg-db:
  mtg-images:
